<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" style="width:100%;max-width:740px;height:auto;display:block" role="img" aria-labelledby="tb-title tb-desc">
  <title id="tb-title">带信任边界的 LLM 应用威胁模型</title>
  <desc id="tb-desc">左侧是边界外的不可信来源：用户输入、网页邮件与检索文档、第三方工具返回值；中间信任边界内是应用编排层、上下文组装、模型运行时、策略与审计、工具网关；右侧是高价值资产：敏感数据、特权工具、凭据与密钥。实线为正常数据与控制流，红色虚线为三条潜在攻击路径：外部内容经上下文组装的间接注入、工具返回值注入模型、模型被说服后绕过工具网关直接调用特权工具。</desc>
  <defs>
    <style>
      .tb-bg { fill: #f9fbfd; }
      .tb-zone-out { fill: #ffffff; stroke: #cfd9e3; stroke-width: 1.5; }
      .tb-zone-in { fill: #ffffff; stroke: #dd6b20; stroke-width: 2.5; stroke-dasharray: 10 7; }
      .tb-zone-asset { fill: #fff7e8; stroke: #e5b55b; stroke-width: 1.5; }
      .tb-box-u { fill: #fff2ef; stroke: #d06d63; stroke-width: 2; }
      .tb-box-a { fill: #edf4ff; stroke: #5b84c4; stroke-width: 2; }
      .tb-box-g { fill: #eef7f1; stroke: #5a9d7b; stroke-width: 2; }
      .tb-zt { font: 700 13.5px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #34495e; }
      .tb-zt-in { font: 700 14px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #c05621; }
      .tb-zs { font: 500 12px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #67452a; }
      .tb-t { font: 700 13.5px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1f2a33; text-anchor: middle; }
      .tb-s { font: 500 11.5px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #465769; text-anchor: middle; }
      .tb-arrow { stroke: #304255; stroke-width: 2; fill: none; marker-end: url(#tb-arrowHead); }
      .tb-attack { stroke: #cc4b37; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#tb-attackHead); }
      .tb-al { font: 700 11.5px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #cc4b37; }
      .tb-legend { font: 500 12.5px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #334455; }
    </style>
    <marker id="tb-arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#304255" />
    </marker>
    <marker id="tb-attackHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc4b37" />
    </marker>
  </defs>

  <rect class="tb-bg" x="0" y="0" width="740" height="470" rx="12" />

  <!-- 三个区域 -->
  <rect class="tb-zone-out" x="15" y="20" width="160" height="375" rx="12" />
  <text class="tb-zt" x="27" y="44">边界外：不可信来源</text>

  <rect class="tb-zone-in" x="195" y="20" width="380" height="375" rx="12" />
  <text class="tb-zt-in" x="210" y="44">信任边界（Trust Boundary）</text>
  <text class="tb-zs" x="210" y="66">在这里把“输入”与“指令”分开，并做权限与来源治理</text>

  <rect class="tb-zone-asset" x="595" y="20" width="130" height="375" rx="12" />
  <text class="tb-zt" x="607" y="44">高价值资产</text>

  <!-- 不可信来源 -->
  <rect class="tb-box-u" x="30" y="85" width="130" height="50" rx="8" />
  <text class="tb-t" x="95" y="115">用户输入</text>
  <rect class="tb-box-u" x="30" y="195" width="130" height="60" rx="8" />
  <text class="tb-t" x="95" y="221">网页 / 邮件</text>
  <text class="tb-s" x="95" y="241">检索文档</text>
  <rect class="tb-box-u" x="30" y="320" width="130" height="60" rx="8" />
  <text class="tb-t" x="95" y="346">第三方工具</text>
  <text class="tb-s" x="95" y="366">返回值</text>

  <!-- 信任边界内 -->
  <rect class="tb-box-a" x="215" y="85" width="140" height="50" rx="8" />
  <text class="tb-t" x="285" y="115">应用编排层</text>
  <rect class="tb-box-a" x="415" y="85" width="140" height="50" rx="8" />
  <text class="tb-t" x="485" y="107">上下文组装</text>
  <text class="tb-s" x="485" y="125">Prompt Builder</text>
  <rect class="tb-box-g" x="315" y="200" width="140" height="50" rx="8" />
  <text class="tb-t" x="385" y="230">模型运行时</text>
  <rect class="tb-box-a" x="215" y="320" width="140" height="60" rx="8" />
  <text class="tb-t" x="285" y="355">策略 / 审计</text>
  <rect class="tb-box-g" x="415" y="320" width="140" height="60" rx="8" />
  <text class="tb-t" x="485" y="355">工具网关</text>

  <!-- 高价值资产 -->
  <rect class="tb-box-g" x="610" y="85" width="100" height="50" rx="8" />
  <text class="tb-t" x="660" y="115">敏感数据</text>
  <rect class="tb-box-g" x="610" y="205" width="100" height="50" rx="8" />
  <text class="tb-t" x="660" y="235">特权工具</text>
  <rect class="tb-box-g" x="610" y="320" width="100" height="60" rx="8" />
  <text class="tb-t" x="660" y="355">凭据 / 密钥</text>

  <!-- 正常数据与控制流 -->
  <path class="tb-arrow" d="M 160 110 L 214 110" />
  <path class="tb-arrow" d="M 355 110 L 414 110" />
  <path class="tb-arrow" d="M 500 135 L 500 182 L 400 182 L 400 199" />
  <path class="tb-arrow" d="M 160 225 L 314 225" />
  <path class="tb-arrow" d="M 160 350 L 214 350" />
  <path class="tb-arrow" d="M 430 250 L 430 319" />
  <path class="tb-arrow" d="M 455 210 L 585 210 L 585 110 L 609 110" />
  <path class="tb-arrow" d="M 555 340 L 585 340 L 585 245 L 609 245" />
  <path class="tb-arrow" d="M 555 360 L 609 360" />

  <!-- 潜在攻击路径 -->
  <path class="tb-attack" d="M 160 205 L 185 205 L 185 162 L 440 162 L 440 136" />
  <text class="tb-al" x="270" y="157">间接注入</text>
  <path class="tb-attack" d="M 160 335 L 185 335 L 185 285 L 340 285 L 340 251" />
  <text class="tb-al" x="236" y="279">返回值注入</text>
  <path class="tb-attack" d="M 455 232 L 609 232" />
  <text class="tb-al" x="470" y="249" style="font-size:11px">绕过网关</text>

  <!-- 图例 -->
  <path class="tb-arrow" d="M 20 425 L 58 425" />
  <text class="tb-legend" x="66" y="430">正常数据 / 控制流</text>
  <path class="tb-attack" d="M 200 425 L 238 425" />
  <text class="tb-legend" x="246" y="430">潜在攻击路径</text>
  <text class="tb-legend" x="20" y="456">重点控制：来源标记、上下文隔离、审批闸门、最小权限、审计留痕</text>
</svg>
